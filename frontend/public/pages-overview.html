<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sentinel Pages Overview · 界面总览</title>

<!--
================================================================================
  SENTINEL PAGES OVERVIEW — 23 界面总览
================================================================================
  【文件定位】frontend/public/pages-overview.html
              纯预览文件，不参与构建，不引用 frontend/src。

  【页面清单（23）】
    C端 (6)： P01 登录  P02 欢迎  P03 对话  P04 更新日志  P05 文档预览  P06 404
    后台(17)：A00 Dashboard  A01 智能体管理  A02 提示词配置  A03 知识库管理
             A04 文档管理  A05 分块管理  A06 知识图谱  A07 意图树配置
             A08 意图列表  A09 数据通道  A10 关键词映射  A11 链路追踪
             A12 审计日志  A13 案件调查  A14 用户管理  A15 示例问题
             A16 系统设置

  【共用设计参数】（与 design-workbench.html 完全一致）
    配色 = 深空底 #04070F + 青 #22D3EE → 蓝 #3B82F6 → 紫 #7C3AED
    侧栏 = 280px，文字区 208px，MARK_SIZE=40，BAR_GAP=8
    对齐 = SIDE_PAD=12，opticalNudge=+12，navNudge=-10，状态 nav=NAVSTYLES[2]
    高亮 = Notch 切角（border-left:2px + clip-path 切角）
    图标 = Hex Shield（pad=0.172），左上角 = 图标 + sentinel（Orbitron）
    首屏 = Fredoka × Squash 弹跳
    侧栏分组：工作区 / 会话 / 资源 / 系统（后台侧栏再加"管理"组）

  【结构】
    每个 tile = 1280×800 原尺寸设计稿 → transform:scale(0.4) → 512×320 缩略图
    点击 tile → 弹出 modal，原尺寸显示 1280×800 页面（侧栏可切换）
================================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;500;700&family=Fredoka:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />

<style>
/* ==========================================================================
   TOKENS
   ========================================================================== */
:root{
  --sx-void:#04070F;--sx-deep:#070C1A;--sx-panel:#0A1020;--sx-card:#0D1426;
  --sx-line:#1A2745;--sx-line-2:#243457;
  --sx-cyan:#22D3EE;--sx-sky:#38BDF8;--sx-blue:#3B82F6;--sx-indigo:#6366F1;
  --sx-violet:#7C3AED;--sx-purple:#A855F7;
  --sx-text:#E6EDF7;--sx-dim:#7C8AA8;--sx-faint:#4A5875;
  --sx-grad:linear-gradient(135deg,#22D3EE 0%,#3B82F6 48%,#7C3AED 100%);
  --sx-grad-soft:linear-gradient(135deg,#38BDF8 0%,#6366F1 55%,#A855F7 100%);
  --ff-display:"Orbitron",sans-serif;
  --ff-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --ff-cartoon:"Fredoka","Segoe UI",sans-serif;
  --ff-cn:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;

  /* 已定稿侧栏几何 */
  --side-w:280px; --side-pad:12px; --mark-size:40px; --bar-gap:8px;
  --text-w:208px; /* = 280 - 24(pad) - 40(icon) - 8(gap) */
  --optical-nudge:12px; --nav-nudge:-10px;
}

/* ==========================================================================
   重置 + 底
   ========================================================================== */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--sx-void);color:var(--sx-text);font-family:var(--ff-cn);min-height:100vh;
  -webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.45;
  background-image:linear-gradient(rgba(34,211,238,.045) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(34,211,238,.045) 1px,transparent 1px);
  background-size:52px 52px;
  mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 10%,transparent 72%);
  -webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 0%,#000 10%,transparent 72%)}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.4;
  background:radial-gradient(900px 480px at 8% -6%,rgba(124,58,237,.22),transparent 60%),
             radial-gradient(760px 420px at 92% 2%,rgba(34,211,238,.14),transparent 62%)}

/* ==========================================================================
   HUD
   ========================================================================== */
.hud{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:11px 22px;background:rgba(7,12,26,.86);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--sx-line)}
.hud .logo{display:flex;align-items:center;gap:10px}
.hud .logo .dot{width:9px;height:9px;border-radius:50%;background:var(--sx-cyan);
  box-shadow:0 0 12px rgba(34,211,238,.55),0 0 34px rgba(34,211,238,.22);animation:livepulse 2.4s ease-in-out infinite}
@keyframes livepulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.82)}}
.hud h1{margin:0;font-family:var(--ff-display);font-size:14.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.hud .sub{font-family:var(--ff-mono);font-size:10.5px;color:var(--sx-faint);letter-spacing:.1em;
  border-left:1px solid var(--sx-line);padding-left:14px}
.hud .spacer{flex:1}
.btn{font-family:var(--ff-mono);font-size:11px;letter-spacing:.06em;background:var(--sx-card);color:var(--sx-dim);
  border:1px solid var(--sx-line-2);border-radius:4px;padding:6px 12px;cursor:pointer;transition:.18s;
  clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.btn:hover{color:var(--sx-cyan);border-color:rgba(34,211,238,.45)}

/* ==========================================================================
   TABS
   ========================================================================== */
.tabs{position:sticky;top:52px;z-index:55;display:flex;gap:2px;padding:0 22px;
  background:rgba(7,12,26,.78);backdrop-filter:blur(10px);border-bottom:1px solid var(--sx-line)}
.tabs button{font-family:var(--ff-mono);font-size:11px;letter-spacing:.05em;color:var(--sx-faint);
  background:transparent;border:0;border-bottom:2px solid transparent;padding:9px 13px;cursor:pointer;
  transition:.18s;display:flex;align-items:center;gap:7px}
.tabs button:hover{color:var(--sx-text)}
.tabs button.cur{color:var(--sx-cyan);border-bottom-color:var(--sx-cyan)}
.tabs button i{font-style:normal;opacity:.5;font-size:10px}
.tabs .cnt{font-family:var(--ff-mono);font-size:10px;color:var(--sx-faint);background:var(--sx-panel);
  border:1px solid var(--sx-line);padding:1px 6px;border-radius:3px}
.tabs button.cur .cnt{color:var(--sx-cyan);border-color:rgba(34,211,238,.35);background:rgba(34,211,238,.07)}

/* ==========================================================================
   GRID
   ========================================================================== */
main{position:relative;z-index:1;max-width:1380px;margin:0 auto;padding:24px 22px 80px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:18px}
.tile{position:relative;background:linear-gradient(160deg,rgba(13,20,38,.92),rgba(7,12,26,.92));
  border:1px solid var(--sx-line);border-radius:6px;padding:14px;cursor:pointer;transition:.2s;
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.tile:hover{border-color:rgba(34,211,238,.5);transform:translateY(-2px)}
.tile::before,.tile::after{content:"";position:absolute;width:10px;height:10px;pointer-events:none}
.tile::before{top:6px;right:6px;border-top:1px solid var(--sx-cyan);border-right:1px solid var(--sx-cyan);opacity:.5}
.tile::after{bottom:6px;left:6px;border-bottom:1px solid var(--sx-cyan);border-left:1px solid var(--sx-cyan);opacity:.5}
.tile .ph{margin:0 0 8px;display:flex;align-items:baseline;gap:10px;position:relative}
.tile .pid{font-family:var(--ff-mono);font-size:10.5px;color:var(--sx-cyan);letter-spacing:.12em;
  border:1px solid rgba(34,211,238,.3);border-radius:3px;padding:2px 7px;background:rgba(34,211,238,.07)}
.tile-cf{position:absolute;top:-2px;right:0;font-family:var(--ff-mono);font-size:9.5px;font-weight:700;
  color:#FEE2E2;background:#B91C1C;border:1px solid #F87171;border-radius:3px;padding:2px 7px;
  box-shadow:0 0 10px rgba(248,113,113,.6);cursor:pointer}
.tile .ttl{margin:0;font-family:var(--ff-display);font-size:14.5px;font-weight:700;letter-spacing:.03em}
.tile .dsc{margin:0 0 10px;font-size:12px;color:var(--sx-dim);line-height:1.7}

/* 缩略图舞台 */
.thumb{position:relative;width:100%;height:300px;overflow:hidden;border-radius:5px;border:1px solid var(--sx-line);
  background:#02050B}
.thumb .ph-old{padding:10px;position:absolute;top:8px;left:10px;z-index:3;
  font-family:var(--ff-mono);font-size:9px;color:var(--sx-faint);letter-spacing:.1em}
.thumb .stage{position:absolute;top:0;left:0;width:1280px;height:800px;transform:scale(.234);
  transform-origin:0 0;background:var(--sx-void);overflow:hidden;pointer-events:none}
.thumb .stage::before{content:"";position:absolute;inset:0;z-index:0;background:radial-gradient(900px 480px at 8% -6%,rgba(124,58,237,.18),transparent 60%),
   radial-gradient(760px 420px at 92% 2%,rgba(34,211,238,.12),transparent 62%);pointer-events:none}
.thumb .stage::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(34,211,238,.04) 1px,transparent 1px),
   linear-gradient(90deg,rgba(34,211,238,.04) 1px,transparent 1px);background-size:46px 46px;
   mask-image:radial-gradient(ellipse 80% 70% at 50% 45%,#000 18%,transparent 78%);pointer-events:none}

/* ==========================================================================
   MODAL（原尺寸 1280×800 预览）
   ========================================================================== */
.modal{position:fixed;inset:0;z-index:200;display:none;background:rgba(2,5,11,.92);backdrop-filter:blur(6px)}
.modal.open{display:flex;align-items:center;justify-content:center}
.modal .box{position:relative;background:var(--sx-panel);border:1px solid var(--sx-line-2);
  border-radius:8px;box-shadow:0 30px 90px -20px rgba(0,0,0,.7);padding:12px;
  clip-path:polygon(20px 0,100% 0,100% calc(100% - 20px),calc(100% - 20px) 100%,0 100%,0 20px)}
.modal .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding:0 4px;gap:12px}
.modal .hd .nm{display:flex;align-items:center;gap:10px}
.modal .hd .nm .pid{font-family:var(--ff-mono);font-size:11px;color:var(--sx-cyan);letter-spacing:.12em;
  border:1px solid rgba(34,211,238,.3);border-radius:3px;padding:2px 8px;background:rgba(34,211,238,.07)}
.modal .hd .nm h2{margin:0;font-family:var(--ff-display);font-size:15px;font-weight:700;letter-spacing:.03em}
.modal .hd .meta{font-family:var(--ff-mono);font-size:10.5px;color:var(--sx-faint)}
.modal .hd .x{font-family:var(--ff-mono);font-size:13px;color:var(--sx-dim);background:transparent;border:1px solid var(--sx-line-2);
  border-radius:4px;padding:5px 10px;cursor:pointer}
.modal .hd .x:hover{color:var(--sx-cyan);border-color:rgba(34,211,238,.45)}
/* 缩放容器：cv 以 1280×800 布局，整体 transform:scale 到可视范围 */
.modal .cvwrap{position:relative;width:1280px;height:800px;margin:0 auto;
  transform-origin:center center}
/* 翻页切换动画 */
.modal .cvwrap.pg-out{animation:pgOut .42s cubic-bezier(.5,.05,.4,1) forwards}
.modal .cvwrap.pg-in{animation:pgIn .42s cubic-bezier(.5,.05,.4,1) forwards}
@keyframes pgOut{to{transform:perspective(1500px) rotateY(-92deg);opacity:0}}
@keyframes pgIn{from{transform:perspective(1500px) rotateY(92deg);opacity:0}to{transform:perspective(1500px) rotateY(0);opacity:1}}
.modal .cv{position:relative;width:1280px;height:800px;background:var(--sx-void);overflow:hidden;
  border:1px solid var(--sx-line);border-radius:6px}
.modal .cv::-webkit-scrollbar{display:none}
/* modal 冲突工具条 */
.modal .cf{display:flex;align-items:center;gap:8px}
.modal .cf .cfbtn{font-family:var(--ff-mono);font-size:10.5px;color:#FCA5A5;
  background:rgba(185,28,28,.15);border:1px solid rgba(248,113,113,.5);border-radius:4px;
  padding:5px 10px;cursor:pointer;transition:.16s}
.modal .cf .cfbtn:hover{background:rgba(185,28,28,.3)}
.modal .cf .cflist{position:absolute;right:0;top:110%;background:rgba(20,8,8,.95);border:1px solid #F87171;
  border-radius:5px;padding:6px;min-width:220px;z-index:80;box-shadow:0 12px 30px -8px rgba(0,0,0,.7)}
.modal .cf .cflist.hide{display:none}
.modal .cf .cflist .it{padding:6px 9px;border-radius:3px;font-family:var(--ff-mono);font-size:10.5px;
  color:#FECACA;cursor:pointer;transition:.12s}
.modal .cf .cflist .it:hover{background:rgba(248,113,113,.25);color:#fff}
.modal .cf .cflist .empty{padding:6px 9px;color:#FCA5A5;font-family:var(--ff-mono);font-size:10.5px}

/* ==========================================================================
   页面级共用组件 .pg-*（在原尺寸画布上）
   设计基准 = 1280 × 800
   ========================================================================== */

/* ==========================================================================
   侧栏 —— 独立化布局（绝对坐标，区块互不挤占）
   坐标系 = 1280×800 画布。侧栏占左 280px 全高。
   侧栏内部各区块均用绝对 top/left/width/height，不依赖彼此。
   ========================================================================== */
.sc-side{position:absolute;top:0;left:0;width:var(--side-w);height:800px;
  background:rgba(8,13,26,.78);backdrop-filter:blur(14px);border-right:1px solid var(--sx-line);
  z-index:5}

/* 品牌区：顶部 12px 起，高 52px */
.sc-side .bar{position:absolute;top:12px;left:12px;width:256px;height:52px;
  display:flex;align-items:center;gap:var(--bar-gap);
  border-bottom:1px solid var(--sx-line)}
.sc-side .mk{width:var(--mark-size);height:var(--mark-size);flex:none;
  margin-left:var(--optical-nudge); /* 抵消 SVG pad，由 JS 精确覆盖 */
  display:flex;align-items:center;justify-content:center}
.sc-side .mk svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 8px rgba(34,211,238,.35))}
/* 图标动效 */
.mk-anim .mk-float{transform-box:view-box;transform-origin:50% 60%;animation:mkFloat 4.2s ease-in-out infinite}
.mk-anim .mk-scan{animation:mkScan 3.2s ease-in-out infinite}
.mk-anim .mk-trace{stroke-dasharray:80;stroke-dashoffset:80;animation:mkTrace 3.4s ease-in-out infinite}
@keyframes mkFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.4px)}}
@keyframes mkScan{0%,100%{transform:translateY(0);opacity:0}14%{opacity:.9}50%{transform:translateY(30px);opacity:.9}86%{opacity:0}}
@keyframes mkTrace{0%{stroke-dashoffset:80}45%,62%{stroke-dashoffset:0}100%{stroke-dashoffset:-80}}
.sc-side .mk svg{width:100%;height:100%;display:block}
.sc-side .txtbox{width:var(--text-w);overflow:hidden;display:flex;align-items:center;height:40px}
.sc-side .wm{font-family:var(--ff-display);font-weight:700;font-size:24px;line-height:1.15;letter-spacing:.02em}
.sc-side .wm .tx{background-image:var(--sx-grad-soft);background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  animation:wmFlow 7s linear infinite}
@keyframes wmFlow{from{background-position:0 50%}to{background-position:220% 50%}}

/* 导航区：品牌区下方起，到账户区之上 */
.sc-side .nav{position:absolute;top:76px;left:12px;width:256px;bottom:60px;overflow:auto}

/* 账户入口（左下角吸底） */
.sc-side .acct{position:absolute;left:12px;right:12px;bottom:12px;height:52px;
  display:flex;align-items:center;gap:10px;cursor:pointer;
  border-top:1px solid var(--sx-line);padding-top:10px}
.sc-side .avt{width:34px;height:34px;border-radius:8px;background:var(--sx-grad);
  font-family:var(--ff-display);font-weight:700;font-size:13px;color:#04070F;
  display:flex;align-items:center;justify-content:center;flex:none}
.sc-side .acct .nm{font-size:13px;font-weight:600;color:var(--sx-text)}
.sc-side .acct .role{font-family:var(--ff-mono);font-size:9.5px;color:var(--sx-faint);letter-spacing:.02em;margin-top:3px}
/* 侧栏文字可读性：提高字号/对比度，减小中文过散字距，保留既定几何与 Notch 高亮 */
.sc-side .navgroup{font-family:var(--ff-cn);font-size:11px;font-weight:700;letter-spacing:.035em;color:#A8B7D4;
  padding:13px 10px 6px;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
.sc-side .navgroup:first-child{padding-top:0}

.navitem{display:flex;align-items:center;gap:8px;position:relative;
  font-size:13.5px;font-weight:600;color:#D2DCF0;letter-spacing:0;line-height:1.35;
  padding:7px 10px;margin-bottom:2px;border:1px solid transparent;border-radius:4px;cursor:default;
  text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;
  transition:background .16s,color .16s,border-color .16s,box-shadow .16s}
.navitem > svg{width:16px;height:16px;flex:none;opacity:.86;transition:.16s}
.navitem:hover{color:#F4F8FF;background:rgba(255,255,255,.045)}
.navitem.act{color:#67E8F9;font-weight:700}
.navitem.act > svg{opacity:1}

/* 已定稿 = Notch 切角 */
.ns-notch .navitem{border-radius:0}
.ns-notch .navitem.act{background:linear-gradient(90deg,rgba(34,211,238,.17),rgba(34,211,238,.015) 72%);
  border-color:transparent;border-left:2px solid var(--sx-cyan);padding-left:9px;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%)}

/* 子项（历史会话） */
.sc-side .subitem{display:flex;align-items:center;gap:9px;position:relative;
  font-size:13px;font-weight:500;color:#AEBBD3;line-height:1.35;padding:6px 10px 6px 26px;
  margin-bottom:1px;border:1px solid transparent;border-left:2px solid transparent;border-radius:0;
  cursor:default;transition:.16s;font-family:var(--ff-cn);text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
.sc-side .subitem .dd{font-size:10px;color:#8290AA;flex:none;font-weight:500;margin-left:auto;padding-left:8px;letter-spacing:0}
.sc-side .subitem.act{color:#F4F8FF;background:linear-gradient(90deg,rgba(34,211,238,.17),rgba(34,211,238,.015) 72%);
  border-left-color:var(--sx-cyan);font-weight:700;clip-path:polygon(0 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%)}

/* ==========================================================================
   主内容区 —— 独立化布局（绝对坐标，与侧栏互不依赖）
   侧栏 280px，故 main 固定 left=280 width=1000，不依赖侧栏宽度变量。
   ========================================================================== */
.sc-main{position:absolute;top:0;left:280px;width:1000px;height:800px;overflow:hidden}
.sc-main.no-topbar .pg-mid{top:0}

/* 顶栏：包含完整背景区域，高度 54px；对话/内容区从其下方开始 */
.pg-top{position:absolute;z-index:20;top:0;left:0;right:0;height:54px;
  display:flex;align-items:center;padding:0 24px;
  border-bottom:1px solid var(--sx-line);background:#080D1A;backdrop-filter:blur(10px);color:var(--sx-dim);font-size:13px}
.pg-top .crumb{display:flex;align-items:center;gap:8px;font-family:var(--ff-cn)}
.pg-top .crumb i{font-style:normal;color:var(--sx-faint);font-family:var(--ff-mono);font-size:11px}
.pg-top .crumb em{font-style:normal;color:var(--sx-cyan);font-weight:600}
.pg-top .r{margin-left:auto;display:flex;gap:14px;align-items:center}
.pg-top .search{display:flex;align-items:center;gap:8px;background:rgba(7,12,26,.6);
  border:1px solid var(--sx-line-2);border-radius:6px;padding:6px 12px;width:220px;transition:.18s}
.pg-top .search:hover,.pg-top .search:focus-within{border-color:rgba(34,211,238,.45)}
.pg-top .search svg{width:13px;height:13px;color:var(--sx-faint);flex:none}
.pg-top .search input{flex:1;background:transparent;border:0;outline:0;color:var(--sx-text);font-size:12.5px;font-family:var(--ff-cn)}
.pg-top .search input::placeholder{color:var(--sx-faint)}
.pg-top .bell{position:relative;width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  color:var(--sx-dim);background:rgba(13,20,38,.5);border:1px solid var(--sx-line-2);cursor:pointer;transition:.16s}
.pg-top .bell:hover{color:var(--sx-cyan);border-color:rgba(34,211,238,.4)}
.pg-top .bell .dot{position:absolute;top:6px;right:7px;width:6px;height:6px;border-radius:50%;background:#F87171;box-shadow:0 0 6px #F87171}
.pg-top .bell svg{width:15px;height:15px}
.pg-top .user{display:flex;align-items:center;gap:9px;padding:4px 8px 4px 4px;border-radius:8px;cursor:pointer;transition:.16s}
.pg-top .user:hover{background:rgba(255,255,255,.04)}
.pg-top .user .uavt{width:28px;height:28px;border-radius:50%;background:var(--sx-grad);
  display:flex;align-items:center;justify-content:center;font-family:var(--ff-display);font-weight:700;font-size:11px;color:#04070F}
.pg-top .user .unm{font-size:12px;font-weight:600;color:var(--sx-text);line-height:1.1}
.pg-top .user .urole{font-family:var(--ff-mono);font-size:9px;color:var(--sx-faint);margin-top:1px}
.pg-top .pill{font-family:var(--ff-mono);font-size:10.5px;color:var(--sx-faint);
  border:1px solid var(--sx-line);border-radius:4px;padding:3px 9px}
.pg-top .pill.cy{color:var(--sx-cyan);border-color:rgba(34,211,238,.3);background:rgba(34,211,238,.05)}

/* 主内容：顶栏下方到 main 底部，锚定 sc-main 左右 */
.pg-mid{position:absolute;top:54px;left:0;right:0;bottom:0;overflow:hidden;display:flex;flex-direction:column;background:#04070F;border-top:1px solid rgba(34,211,238,.08)}
.sc-main.no-topbar .pg-mid{border-top:0}

/* 通用首屏 */
.pg-hero{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:30px;gap:18px}
.pg-hero .wmc{display:inline-block;font-family:var(--ff-cartoon);
  font-size:80px;font-weight:700;line-height:1.2;letter-spacing:.01em;white-space:nowrap;padding-bottom:.14em}
.pg-hero .wmc .ch{position:relative;display:inline-block;transform-origin:50% 88%;will-change:transform}
.pg-hero .wmc .ch-txt{display:inline-block;background-image:var(--sx-grad-soft);background-size:210% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  animation:wmFlow 7s linear infinite}
.pg-hero .wmc .ch-sh{position:absolute;left:50%;bottom:-.06em;width:.78em;height:.13em;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(34,211,238,.5),rgba(34,211,238,0) 72%);
  transform:translateX(-50%);pointer-events:none}
.b-squash .ch{animation:bSq 2.4s infinite;animation-delay:calc(var(--i) * .07s)}
.b-squash .ch-sh{animation:sSq 2.4s infinite;animation-delay:calc(var(--i) * .07s)}
@keyframes bSq{
  0%,52%,100%{transform:translateY(0) scale(1,1);animation-timing-function:ease-in-out}
  56%{transform:translateY(4px) scale(1.14,.86);animation-timing-function:cubic-bezier(.2,.7,.4,1)}
  63%{transform:translateY(-35px) scale(.92,1.12);animation-timing-function:cubic-bezier(.4,0,.6,1)}
  71%{transform:translateY(-43px) scale(1,1);animation-timing-function:cubic-bezier(.5,0,.7,.6)}
  79%{transform:translateY(-6px) scale(.95,1.08);animation-timing-function:cubic-bezier(.3,0,.7,1)}
  85%{transform:translateY(0) scale(1.28,.74);animation-timing-function:cubic-bezier(.2,.9,.4,1)}
  90%{transform:translateY(-10px) scale(.97,1.05);animation-timing-function:cubic-bezier(.4,0,.6,1)}
  94%{transform:translateY(0) scale(1.11,.91);animation-timing-function:ease-out}
  97%{transform:translateY(0) scale(1.03,.97)}}
@keyframes sSq{
  0%,52%,100%{transform:translateX(-50%) scale(1);opacity:.45}
  71%{transform:translateX(-50%) scale(.58);opacity:.14}
  85%{transform:translateX(-50%) scale(1.30);opacity:.55}
  94%{transform:translateX(-50%) scale(1.06);opacity:.48}}

.pg-hero .lead{font-size:14px;color:var(--sx-dim);max-width:520px;line-height:1.8;font-weight:400}
.pg-hero .cta{display:flex;gap:10px;margin-top:6px}
.pg-btn{font-family:var(--ff-display);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  border-radius:4px;padding:10px 20px;cursor:pointer;transition:.2s;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.pg-btn.pri{background:var(--sx-grad);color:#04070F;border:0;box-shadow:0 8px 24px -8px rgba(34,211,238,.5)}
.pg-btn.ghost{background:transparent;color:var(--sx-cyan);border:1px solid rgba(34,211,238,.3)}

/* ==========================================================================
   C端 对话 —— 参照主流 AI agent（ChatGPT/Claude/Kimi）
   消息 = 宽整行，助手靠左带头像，用户靠右整行，不贴小气泡
   输入框 = 居中大输入框
   ========================================================================== */
.pg-conv{flex:1;display:flex;flex-direction:column;padding:36px 56px;overflow:auto;gap:6px;min-height:0}

/* 每条消息是一整行（flex row，自动换行区在右侧可扩展） */
.pg-conv .b{display:flex;gap:14px;align-items:flex-start;padding:14px 0}
/* 助手消息：头像在左，内容整行左对齐 */
.pg-conv .b.ai{justify-content:flex-start}
.pg-conv .b.ai .avt{width:34px;height:34px;border-radius:8px;background:var(--sx-grad);flex:none;margin-top:2px;
  box-shadow:0 0 12px rgba(34,211,238,.35);position:relative;overflow:hidden}
.pg-conv .b.ai .avt::after{content:"";position:absolute;left:-4px;right:-4px;height:2px;top:0;
  background:linear-gradient(90deg,transparent,#E0F7FA,transparent);animation:avtScan 3.4s ease-in-out infinite}
@keyframes avtScan{0%,100%{top:0}50%{top:32px}}
.pg-conv .b.ai .body{flex:1;max-width:720px}
.pg-conv .b.ai .who{font-weight:600;color:var(--sx-cyan);font-size:13px;letter-spacing:.03em;margin-bottom:8px}
.pg-conv .b.ai .txt{font-size:15px;line-height:1.8;color:#D7E2F5}
.pg-conv .b.ai .txt code{font-family:var(--ff-mono);font-size:13px;color:var(--sx-sky);
  background:rgba(56,189,248,.1);padding:1px 6px;border-radius:4px}

/* 用户消息：右侧整行，无气泡框（主流做法） */
.pg-conv .b.me{justify-content:flex-end}
.pg-conv .b.me .body{max-width:720px;text-align:right}
.pg-conv .b.me .who{font-weight:600;color:var(--sx-dim);font-size:13px;letter-spacing:.03em;margin-bottom:8px}
.pg-conv .b.me .txt{display:inline-block;font-size:15px;line-height:1.8;color:var(--sx-text);
  background:linear-gradient(135deg,rgba(59,130,246,.16),rgba(124,58,237,.16));
  border:1px solid rgba(34,211,238,.25);border-radius:14px;padding:10px 18px;max-width:560px}

/* 动作条 */
.pg-conv .act{display:flex;gap:4px;align-items:center;margin-top:10px}
.pg-conv .act .v-btn{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:#8A9BBD;background:transparent;border:1px solid transparent;transition:.16s}
.pg-conv .act .v-btn:hover{color:var(--sx-cyan);background:rgba(34,211,238,.1);border-color:rgba(34,211,238,.3)}
.pg-conv .act .v-btn svg{width:14px;height:14px}
/* 助手动作条常亮，用户 hover 显现 */
.pg-conv .b.ai .act{opacity:1}
.pg-conv .b.me .act{justify-content:flex-end;opacity:0;transition:opacity .18s}
.pg-conv .b.me:hover .act{opacity:1}

/* 输入框：居中大输入框 */
.pg-input{padding:22px 56px 34px;border-top:1px solid var(--sx-line);background:rgba(8,13,26,.5);backdrop-filter:blur(10px)}
.pg-input .box{max-width:720px;margin:0 auto;display:flex;align-items:flex-end;gap:12px;
  background:rgba(13,20,38,.9);border:1px solid var(--sx-line-2);border-radius:14px;
  padding:14px 16px;min-height:64px;transition:border-color .2s,box-shadow .2s}
.pg-input .box:focus-within{border-color:rgba(34,211,238,.5);box-shadow:0 0 0 3px rgba(34,211,238,.12)}
.pg-input input{flex:1;background:transparent;border:0;outline:0;color:var(--sx-text);font-size:15px;font-family:var(--ff-cn);
  line-height:1.6;min-height:32px;resize:none}
.pg-input input::placeholder{color:var(--sx-faint)}
.pg-input .send{flex:none;font-family:var(--ff-mono);font-weight:700;font-size:12px;letter-spacing:.08em;
  color:#04070F;background:var(--sx-grad);padding:10px 22px;border-radius:9px;cursor:pointer;
  transition:opacity .2s,transform .1s}
.pg-input .send:hover{opacity:.9}
.pg-input .send:active{transform:translateY(1px)}

/* 登录页 */
.pg-login{display:flex;flex:1;align-items:center;justify-content:center}
.pg-login .card{width:380px;padding:30px 32px 28px;background:rgba(13,20,38,.7);backdrop-filter:blur(14px);
  border:1px solid var(--sx-line-2);border-radius:7px;
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.pg-login h3{margin:0 0 4px;font-family:var(--ff-display);font-size:15px;font-weight:700;letter-spacing:.04em}
.pg-login .lead{margin:0 0 22px;font-size:12px;color:var(--sx-dim)}
.pg-login label{display:block;font-size:11px;color:var(--sx-dim);margin-bottom:5px;margin-top:14px;font-weight:500}
.pg-login label:first-of-type{margin-top:0}
.pg-login input{width:100%;background:rgba(7,12,26,.6);border:1px solid var(--sx-line-2);border-radius:4px;
  padding:10px 12px;color:var(--sx-text);font-size:13px;font-family:var(--ff-cn);outline:none;transition:.16s}
.pg-login input:focus{border-color:rgba(34,211,238,.5);background:rgba(7,12,26,.85)}
.pg-login .submit{margin-top:24px;width:100%;background:var(--sx-grad);color:#04070F;font-weight:700;
  font-family:var(--ff-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  border:0;padding:12px;border-radius:4px;cursor:pointer;
  clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}
.pg-login .hint{margin-top:14px;text-align:center;font-size:11px;color:var(--sx-faint)}
.pg-login .hint a{color:var(--sx-cyan);text-decoration:none}

/* 通用卡片/章节 */
.pg-body{position:absolute;top:54px;left:0;right:0;bottom:0;overflow:auto;padding:22px 26px}
.pg-hd{display:flex;align-items:baseline;gap:14px;margin-bottom:18px}
.pg-hd h1{margin:0;font-family:var(--ff-display);font-size:22px;font-weight:700;letter-spacing:.03em}
.pg-hd .sub{font-size:12.5px;color:var(--sx-dim)}
.pg-hd .r{margin-left:auto;display:flex;gap:8px}
.tbtn{font-family:var(--ff-mono);font-size:10.5px;color:var(--sx-cyan);background:transparent;
  border:1px solid rgba(34,211,238,.35);border-radius:4px;padding:6px 12px;cursor:pointer;transition:.16s;
  clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px)}
.tbtn:hover{background:rgba(34,211,238,.1)}
.tbtn.ghost{color:var(--sx-dim);border-color:var(--sx-line-2)}
.tbtn.ghost:hover{color:var(--sx-text);border-color:var(--sx-line-2);background:rgba(255,255,255,.04)}

.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi .c{background:var(--sx-card);border:1px solid var(--sx-line);border-radius:5px;padding:14px 16px;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.kpi .c .lbl{font-family:var(--ff-mono);font-size:10px;color:var(--sx-faint);letter-spacing:.06em;text-transform:uppercase}
.kpi .c .val{font-family:var(--ff-display);font-weight:700;font-size:26px;color:var(--sx-text);line-height:1.1;margin-top:6px}
.kpi .c .delta{font-size:11px;margin-top:6px;color:#34D399;font-family:var(--ff-mono)}
.kpi .c .delta.dn{color:#F87171}

.panel{background:var(--sx-card);border:1px solid var(--sx-line);border-radius:5px;padding:18px 20px}
.panel h3{margin:0 0 12px;font-family:var(--ff-display);font-size:13px;font-weight:700;letter-spacing:.04em}
.panel table{width:100%;border-collapse:collapse;font-size:12px}
.panel table th{font-family:var(--ff-mono);font-size:10px;color:var(--sx-faint);text-align:left;font-weight:500;
  padding:8px 10px;border-bottom:1px solid var(--sx-line);text-transform:uppercase;letter-spacing:.06em}
.panel table td{padding:9px 10px;border-bottom:1px solid var(--sx-line);color:var(--sx-text)}
.panel table tr:last-child td{border-bottom:0}
.panel table tr:hover td{background:rgba(34,211,238,.04)}
.tag{font-family:var(--ff-mono);font-size:10px;padding:2px 7px;border-radius:3px;letter-spacing:.03em}
.tag.cy{color:var(--sx-cyan);border:1px solid rgba(34,211,238,.35);background:rgba(34,211,238,.07)}
.tag.vi{color:var(--sx-purple);border:1px solid rgba(168,85,247,.35);background:rgba(168,85,247,.07)}
.tag.ok{color:#34D399;border:1px solid rgba(52,211,153,.35);background:rgba(52,211,153,.07)}
.tag.wn{color:#FBBF24;border:1px solid rgba(251,191,36,.35);background:rgba(251,191,36,.07)}
.tag.bd{color:#F87171;border:1px solid rgba(248,113,113,.35);background:rgba(248,113,113,.07)}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.row23{display:grid;grid-template-columns:2fr 1fr;gap:14px}

/* 伪图表 */
.chart{height:200px;position:relative;background:linear-gradient(180deg,rgba(34,211,238,.04),transparent);
  border-radius:4px;padding:10px;overflow:hidden}
.chart svg{width:100%;height:100%;display:block}
.chart .ax{position:absolute;font-family:var(--ff-mono);font-size:9px;color:var(--sx-faint)}

/* 知识图谱 */
.graph{position:relative;height:100%;background:radial-gradient(600px 360px at 50% 50%,rgba(124,58,237,.18),transparent 70%);overflow:hidden}
.graph svg{position:absolute;inset:0;width:100%;height:100%}
.graph .lbl{position:absolute;font-family:var(--ff-cn);font-size:10.5px;color:var(--sx-text);
  background:rgba(7,12,26,.85);padding:2px 7px;border-radius:3px;border:1px solid var(--sx-line-2)}
.graph .lbl.cyan{color:var(--sx-cyan);border-color:rgba(34,211,238,.4)}

/* 通用列表 */
.lst-item{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--sx-card);
  border:1px solid var(--sx-line);border-radius:5px;margin-bottom:8px;
  clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}
.lst-item .ic{width:30px;height:30px;border-radius:5px;background:rgba(34,211,238,.1);display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(34,211,238,.3);color:var(--sx-cyan);flex:none}
.lst-item .ic svg{width:14px;height:14px}
.lst-item .nm{font-size:13px;font-weight:600;color:var(--sx-text)}
.lst-item .dsc{font-size:11px;color:var(--sx-dim);margin-top:2px}
.lst-item .r{margin-left:auto;display:flex;align-items:center;gap:8px}

/* 更新日志 */
.chn{padding:16px 18px;background:var(--sx-card);border:1px solid var(--sx-line);border-radius:5px;margin-bottom:10px;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.chn .v{font-family:var(--ff-display);font-weight:700;font-size:14px;color:var(--sx-cyan);letter-spacing:.04em}
.chn .d{font-family:var(--ff-mono);font-size:10px;color:var(--sx-faint);margin-left:10px}
.chn ul{margin:8px 0 0;padding-left:20px;font-size:12.5px;color:var(--sx-text);line-height:1.85}
.chn ul li b{color:#34D399;font-weight:600}
.chn ul li i{font-style:normal;color:var(--sx-purple);font-weight:600}

/* ==========================================================================
   ADM —— P05 风格后台统一框架
   左分栏导航 + 右侧留白内容区，一屏可见、不塞满、不滚动
   ========================================================================== */
.adm{position:absolute;top:54px;left:0;right:0;bottom:0;display:flex;overflow:hidden;--adm-nav-w:190px}
/* 左侧分类导航栏 */
.adm-nav{width:var(--adm-nav-w);flex:none;border-right:1px solid var(--sx-line);background:rgba(8,13,26,.35);padding:20px 10px;overflow:auto}
.adm-resizer{position:absolute;top:0;bottom:0;left:calc(var(--adm-nav-w) - 4px);width:8px;z-index:5;cursor:col-resize;touch-action:none}
.adm-resizer::after{content:"";position:absolute;top:0;bottom:0;left:3px;width:1px;background:transparent;transition:background .15s}
.adm-resizer:hover::after,.adm.is-resizing .adm-resizer::after{background:var(--sx-cyan)}
.adm.is-resizing,.adm.is-resizing *{cursor:col-resize!important;user-select:none}
.adm-nav .grp{margin-bottom:20px}
.adm-nav .grp h4{margin:0 0 9px;font-family:var(--ff-cn);font-size:11px;font-weight:700;letter-spacing:.04em;color:#A8B7D4;text-rendering:optimizeLegibility}
.adm-nav .it{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:6px;font-size:13.5px;font-weight:600;color:#D2DCF0;line-height:1.35;cursor:pointer;transition:.15s;margin-bottom:3px;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
.adm-nav .it:hover{color:#F4F8FF;background:rgba(255,255,255,.045)}
.adm-nav .it.cur{color:#67E8F9;font-weight:700;background:linear-gradient(90deg,rgba(34,211,238,.16),transparent);border-left:2px solid var(--sx-cyan)}
.adm-nav .it svg{width:15px;height:15px;opacity:.9}
.adm-nav .it .cnt{margin-left:auto;font-family:var(--ff-mono);font-size:10.5px;color:#8290AA;font-weight:600}
/* 右侧内容区 */
.adm-content{flex:1;padding:34px 44px;overflow:auto}
.adm-content .ttl{margin:0 0 4px;font-family:var(--ff-display);font-size:22px;font-weight:700;letter-spacing:.03em}
.adm-content .sub{margin:0 0 26px;font-size:13px;color:var(--sx-dim)}
.adm-content .sec{margin-bottom:30px}
.adm-content .sec h3{margin:0 0 14px;font-family:var(--ff-display);font-size:13px;font-weight:700;letter-spacing:.05em;color:var(--sx-cyan)}
/* 内容区内的面板/表格：更宽松、一屏可见 */
.adm-content .panel{background:var(--sx-card);border:1px solid var(--sx-line);border-radius:6px;padding:22px 24px;margin-bottom:16px}
.adm-content table{width:100%;border-collapse:collapse;font-size:12.5px}
.adm-content table th{font-family:var(--ff-mono);font-size:10px;color:var(--sx-faint);text-align:left;font-weight:500;
  padding:10px 12px;border-bottom:1px solid var(--sx-line-2);text-transform:uppercase;letter-spacing:.06em}
.adm-content table td{padding:12px;border-bottom:1px solid var(--sx-line);color:var(--sx-text)}
.adm-content table tr:last-child td{border-bottom:0}
.adm-content table tr:hover td{background:rgba(34,211,238,.04)}
.adm-content .cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.adm-content .cgcard{background:var(--sx-card);border:1px solid var(--sx-line);border-radius:6px;padding:20px;transition:.18s}
.adm-content .cgcard:hover{border-color:rgba(34,211,238,.35)}
.adm-content .cgcard .nm{font-size:14px;font-weight:600;color:var(--sx-text);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.adm-content .cgcard .stat{display:flex;justify-content:space-between;font-size:12px;color:var(--sx-dim);padding:6px 0;border-bottom:1px solid var(--sx-line)}
.adm-content .cgcard .stat:last-child{border-bottom:0}

/* 文档预览（P05 保留） */
.doc{position:absolute;top:54px;left:0;right:0;bottom:0;display:flex;overflow:hidden}
.doc .toc{width:220px;flex:none;border-right:1px solid var(--sx-line);padding:18px 16px;overflow:auto;background:rgba(8,13,26,.4)}
.doc .toc h4{margin:0 0 10px;font-family:var(--ff-display);font-size:11px;letter-spacing:.1em;color:var(--sx-cyan);text-transform:uppercase}
.doc .toc .tg{display:block;padding:5px 9px;font-size:12px;color:var(--sx-dim);border-radius:3px;cursor:default}
.doc .toc .tg.cur{color:var(--sx-cyan);background:rgba(34,211,238,.08);font-weight:600}
.doc .content{flex:1;padding:30px 50px;overflow:auto;line-height:1.9;font-size:13.5px}
.doc .content h1{margin:0 0 14px;font-family:var(--ff-display);font-size:22px;letter-spacing:.02em}
.doc .content h2{margin:24px 0 10px;font-size:16px;color:var(--sx-cyan);font-family:var(--ff-display);letter-spacing:.03em}
.doc .content p{color:var(--sx-text)}
.doc .content code{font-family:var(--ff-mono);font-size:12px;color:var(--sx-sky);background:rgba(56,189,248,.1);padding:1px 6px;border-radius:3px}
.doc .content pre{background:rgba(7,12,26,.85);border:1px solid var(--sx-line);border-radius:4px;padding:14px;
  font-family:var(--ff-mono);font-size:11.5px;line-height:1.7;color:var(--sx-text);overflow:auto}

/* 404 */
.pg-404{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:30px}
.pg-404 .big{font-family:var(--ff-display);font-weight:900;font-size:180px;line-height:1;
  background-image:var(--sx-grad);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;letter-spacing:-.02em}
.pg-404 .msg{font-size:15px;color:var(--sx-dim);max-width:440px}
.pg-404 .crumbs{font-family:var(--ff-mono);font-size:11px;color:var(--sx-faint);letter-spacing:.04em}

/* 意图树 */
.tree{position:absolute;top:54px;left:0;right:0;bottom:0;display:flex;overflow:auto;padding:20px 24px;gap:14px;align-items:flex-start}
.tnode{background:var(--sx-card);border:1px solid var(--sx-line);border-radius:5px;padding:10px 12px;min-width:170px;
  position:relative;clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}
.tnode .ttl{font-size:12px;font-weight:600;color:var(--sx-text)}
.tnode .meta{font-family:var(--ff-mono);font-size:10px;color:var(--sx-faint);margin-top:4px}
.tnode.root{background:linear-gradient(135deg,rgba(34,211,238,.18),rgba(124,58,237,.18));border-color:rgba(34,211,238,.4)}
.tnode.cur{border-color:var(--sx-cyan);box-shadow:0 0 0 1px rgba(34,211,238,.4)}

/* 关键词映射 */
.kmap{position:absolute;top:54px;left:0;right:0;bottom:0;display:flex;overflow:hidden}
.kmap .l{width:240px;border-right:1px solid var(--sx-line);padding:16px;overflow:auto}
.kmap .l .grp{margin-bottom:14px}
.kmap .l .grp h4{margin:0 0 6px;font-family:var(--ff-display);font-size:11px;letter-spacing:.06em;color:var(--sx-cyan);text-transform:uppercase}
.kmap .l .kw{display:inline-block;font-family:var(--ff-mono);font-size:11px;padding:3px 9px;border-radius:3px;
  background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.25);color:var(--sx-cyan);margin:2px;cursor:default}
.kmap .r{flex:1;padding:24px;overflow:auto}
.kmap .r h3{margin:0 0 10px;font-family:var(--ff-display);font-size:14px;letter-spacing:.03em}
.kmap .r .row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:3px;font-size:12.5px}
.kmap .r .row:nth-child(odd){background:rgba(255,255,255,.02)}

/* 数据通道 */
.flow{position:absolute;top:54px;left:0;right:0;bottom:0;display:flex;overflow:auto;padding:22px;gap:18px;align-items:flex-start}
.fcol{display:flex;flex-direction:column;gap:10px;min-width:160px}
.fcol h5{margin:0 0 4px;font-family:var(--ff-display);font-size:11px;letter-spacing:.06em;color:var(--sx-cyan);text-transform:uppercase}
.fbox{background:var(--sx-card);border:1px solid var(--sx-line);border-radius:5px;padding:10px 12px;font-size:12px}
.fbox.c_in{border-left:3px solid var(--sx-cyan)}
.fbox.c_proc{border-left:3px solid var(--sx-violet)}
.fbox.c_out{border-left:3px solid #34D399}
.fbox .nm{font-weight:600}
.fbox .meta{font-family:var(--ff-mono);font-size:10px;color:var(--sx-faint);margin-top:2px}
.farr{position:absolute;font-family:var(--ff-mono);font-size:14px;color:var(--sx-cyan);opacity:.5}

/* 时间线（链路/审计） */
.tline{position:absolute;top:54px;left:0;right:0;bottom:0;padding:24px 30px;overflow:auto}
.tl-row{display:grid;grid-template-columns:90px 1fr 110px;gap:14px;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--sx-line);font-size:12.5px}
.tl-row .t{font-family:var(--ff-mono);font-size:11px;color:var(--sx-faint)}
.tl-row .msg{color:var(--sx-text)}
.tl-row .who{font-family:var(--ff-mono);font-size:10.5px;color:var(--sx-dim);text-align:right}

/* 案件调查 */
.case{position:absolute;top:54px;left:0;right:0;bottom:0;display:flex;overflow:hidden}
.case .l{width:200px;border-right:1px solid var(--sx-line);background:rgba(8,13,26,.4);overflow:auto}
.case .l .i{padding:11px 14px;border-bottom:1px solid var(--sx-line);cursor:default}
.case .l .i.cur{background:rgba(34,211,238,.08);border-left:3px solid var(--sx-cyan)}
.case .l .i .id{font-family:var(--ff-mono);font-size:10px;color:var(--sx-faint)}
.case .l .i .nm{font-size:12.5px;font-weight:600;color:var(--sx-text);margin:2px 0}
.case .l .i .st{font-family:var(--ff-mono);font-size:9.5px}
.case .r{flex:1;overflow:auto;padding:22px 28px}
.case .r h2{margin:0 0 8px;font-family:var(--ff-display);font-size:18px;letter-spacing:.03em}
.case .evs{display:flex;flex-direction:column;gap:8px}
.case .ev{display:flex;gap:12px;padding:10px 14px;background:var(--sx-card);border:1px solid var(--sx-line);border-radius:4px;font-size:12.5px}
.case .ev .tm{font-family:var(--ff-mono);font-size:10.5px;color:var(--sx-faint);min-width:96px}

/* 链接追踪图 */
.trace-graph{position:relative;flex:1;background:radial-gradient(ellipse 600px 400px at 50% 50%,rgba(34,211,238,.1),transparent 70%)}
.trace-graph svg{position:absolute;inset:0;width:100%;height:100%}

/* 提示 */
.pg-empty{flex:1;display:flex;align-items:center;justify-content:center;
  font-family:var(--ff-mono);font-size:13px;color:var(--sx-faint);letter-spacing:.04em}

/* ==========================================================================
   重叠冲突标记 —— 模块独立化后，仅当两模块矩形相交才标红
   ========================================================================== */
.ovl{outline:2px dashed #F87171 !important;outline-offset:-2px;
  box-shadow:inset 0 0 0 1px rgba(248,113,113,.55),0 0 12px rgba(248,113,113,.35) !important}
/* 报错式冲突标注：用真实 DOM，避免伪元素在缩放/overflow 下不可见 */
.ovl-badge{position:absolute;z-index:120;top:2px;left:2px;
  font-family:var(--ff-mono);font-size:18px;font-weight:800;line-height:1;color:#FFF1F2;background:#B91C1C;
  border:1px solid #F87171;padding:5px 8px;border-radius:3px;pointer-events:none;white-space:nowrap;
  box-shadow:0 0 10px rgba(248,113,113,.75);transform:scale(.5);transform-origin:0 0}
.ovl-hit{position:absolute;z-index:115;background:rgba(248,113,113,.32);border:2px solid #F87171;
  box-shadow:0 0 14px rgba(248,113,113,.75),inset 0 0 10px rgba(127,29,29,.55);pointer-events:none}
.ovl-hit::after{content:"重叠区";position:absolute;left:3px;top:3px;font-family:var(--ff-mono);font-size:18px;font-weight:800;
  color:#FFF1F2;background:#B91C1C;border:1px solid #F87171;padding:4px 7px;border-radius:2px;transform:scale(.5);transform-origin:0 0}
.thumb .ovl-badge{font-size:38px;padding:7px 12px;transform:none;top:4px;left:4px}
.thumb .ovl-hit::after{font-size:38px;padding:7px 12px;transform:none}
/* 冲突汇总面板 */
.ovl-panel{position:fixed;right:16px;bottom:16px;z-index:300;max-width:340px;
  background:rgba(127,29,29,.92);backdrop-filter:blur(8px);border:1px solid #F87171;
  border-radius:6px;padding:10px 12px;font-family:var(--ff-mono);font-size:10.5px;color:#FEE2E2;
  box-shadow:0 12px 30px -10px rgba(0,0,0,.6)}
.ovl-panel b{color:#FCA5A5}
.ovl-panel .row{display:flex;justify-content:space-between;gap:10px;padding:3px 0;
  border-bottom:1px solid rgba(248,113,113,.2)}
.ovl-panel .row:last-child{border-bottom:0}
.ovl-panel .x{position:absolute;top:4px;right:6px;cursor:pointer;color:#FCA5A5;font-weight:700}
.ovl-clear{background:transparent;border:1px solid rgba(248,113,113,.5);color:#FECACA;border-radius:3px;
  font-family:var(--ff-mono);font-size:9.5px;padding:3px 8px;cursor:pointer;margin-top:6px}
</style>
</head>
<body>

<div class="hud">

      <div class="cv" id="mCv"></div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ==========================================================================
   ICONS（与 design-workbench 完全一致；其中 Hex 用于侧栏品牌区）
   pad 单位 = SVG 内部左留白 / 64，JS 自动计算 margin-left 抵消
   ========================================================================== */
function grad(u){return '<linearGradient id="g'+u+'" x1="0" y1="0" x2="1" y2="1">'+
  '<stop offset="0" stop-color="#22D3EE"/><stop offset=".48" stop-color="#3B82F6"/>'+
  '<stop offset="1" stop-color="#7C3AED"/></linearGradient>'}

var HEX_SVG='<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" class="mk-anim">'+
  '<defs>'+grad('h0')+'<clipPath id="cph0"><path d="M32 7 L53 19 V41 L32 53 L11 41 V19 Z"/></clipPath></defs>'+
  '<g class="mk-float">'+
  '<path d="M32 7 L53 19 V41 L32 53 L11 41 V19 Z" fill="url(#g0)"/>'+
  '<path d="M32 7 L53 19 V26 L32 38 L11 26 V19 Z" fill="#fff" opacity=".12"/>'+
  '<g clip-path="url(#cph0)"><rect class="mk-scan" x="8" y="12" width="48" height="2.4" fill="#E0F7FA" opacity=".95"/></g>'+
  '<path d="M32 7 L53 19 V41 L32 53 L11 41 V19 Z" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="1.6"/>'+
  '<path class="mk-trace" d="M20 30 L26 30 L29 25 L35 35 L38 30 L44 30" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>'+
  '</g></svg>';
var ICON_PAD=0.172; /* Hex Shield 的可见图形左留白 */
var MARK_SIZE=40;
var OPT_NUDGE=12;
var markOffset = -(MARK_SIZE * ICON_PAD) + OPT_NUDGE; /* ≈ +5.12px */

/* 侧栏图标（行内 16×16） */
var NAV_ICONS={
  plus:'<path d="M12 5v14M5 12h14"/>',
  hist:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  back:'<path d="M19 12H5 M11 6l-6 6 6 6"/>',
  db:'<ellipse cx="12" cy="6" rx="7.5" ry="2.8"/><path d="M4.5 6v12c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8V6"/><path d="M4.5 12c0 1.5 3.4 2.8 7.5 2.8s7.5-1.3 7.5-2.8"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.9 1.9M16.8 16.8l1.9 1.9M18.7 5.3l-1.9 1.9M7.2 16.8l-1.9 1.9"/>',
  shield:'<path d="M12 2 L20 5 V12 C20 16 17 19 12 22 C7 19 4 16 4 12 V5 Z"/>',
  brain:'<path d="M8 8 C6 8 5 9 5 11 C5 12 5 13 6 13 C5 14 6 16 8 16 V19 H10 V16 C11 16 12 15 12 13 C13 13 14 12 14 11 C14 9 13 8 11 8 Z"/>',
  doc:'<path d="M6 3 H14 L18 7 V21 H6 Z"/><path d="M14 3 V7 H18"/><path d="M8 11 H16 M8 14 H16 M8 17 H13"/>',
  layers:'<path d="M12 2 L22 7 L12 12 L2 7 Z"/><path d="M2 12 L12 17 L22 12"/><path d="M2 17 L12 22 L22 17"/>',
  tree:'<circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="12" r="2.5"/><path d="M6 8.5 V15.5 M6 12 H15.5"/>',
  flow:'<rect x="3" y="9" width="6" height="6" rx="1"/><rect x="15" y="9" width="6" height="6" rx="1"/><path d="M9 12 H15"/>',
  tag:'<path d="M3 12 L12 3 H20 V11 L11 20 Z"/><circle cx="16" cy="8" r="1.3"/>',
  link:'<path d="M9 9 H7 A3 3 0 0 0 7 15 H9 M15 9 H17 A3 3 0 0 1 17 15 H15 M9 12 H15"/>',
  scroll:'<path d="M5 4 H17 V20 L14 17 L11 20 L8 17 L5 20 Z"/><path d="M8 9 H14 M8 12 H14 M8 15 H12"/>',
  warn:'<path d="M12 3 L22 20 H2 Z"/><path d="M12 10 V14 M12 17 V17.1"/>',
  case:'<path d="M5 8 H19 V20 H5 Z"/><path d="M9 8 V5 H15 V8"/>',
  users:'<circle cx="9" cy="9" r="3"/><circle cx="17" cy="10" r="2"/><path d="M3 19 C3 15 6 13 9 13 S15 15 15 19 M14 19 C14 16 16 15 17 15 S21 16 21 19"/>',
  bulb:'<path d="M9 18 H15 M10 21 H14"/><path d="M7 11 C7 7 9 5 12 5 S17 7 17 11 C17 13 16 14 15 15 V17 H9 V15 C8 14 7 13 7 11 Z"/>',
  cog:'<circle cx="12" cy="12" r="3.5"/><path d="M12 3 V6 M12 18 V21 M3 12 H6 M18 12 H21 M5.6 5.6 L7.7 7.7 M16.3 16.3 L18.4 18.4 M5.6 18.4 L7.7 16.3 M16.3 7.7 L18.4 5.6"/>',
  copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16 V6 A2 2 0 0 1 6 4 H16"/>',
  edit:'<path d="M4 20 H20 M4 17 L15 6 L18 9 L7 20 Z"/>',
  thumbsup:'<path d="M14 9 V4 C14 3 13 2 12 2 L7 10 V21 H16 C17 21 18 20 18 19 L19 12 C19 11 18 10 17 10 H14 M7 10 H4 V21 H7"/>',
  thumbsdown:'<path d="M14 15 V20 C14 21 13 22 12 22 L7 14 V3 H16 C17 3 18 4 18 5 L19 12 C19 13 18 14 17 14 H14 M7 14 H4 V3 H7"/>',
  retry:'<path d="M3 12 A9 9 0 1 0 7 5.5 L10 3 V9 H4"/>',
  bell:'<path d="M18 8 A6 6 0 0 0 6 8 C6 13 4 15 4 16 H20 C20 15 18 13 18 8 Z"/><path d="M10 20 A2 2 0 0 0 14 20"/>'
};
function nIc(k){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" '+
  'stroke-linecap="round" stroke-linejoin="round">'+NAV_ICONS[k]+'</svg>'}

/* ==========================================================================
   侧栏组件 —— cSide({activeId, withHistory, admin})
     activeId = 当前页 ID（决定哪一项高亮 + 历史会话高亮）
     withHistory = C 端是否显示「历史会话」子项（后台默认显示）
     admin = true 则后台侧栏（多一组「管理」）
     返回侧栏完整 HTML
   ========================================================================== */
function cSide(o){
  o = o || {};
  var groups = [];

  /* C 端（非 admin）：显示对话相关导航 */
  if(!o.admin){
    groups.push({g:'工作区', items:[{i:'plus', t:'新建对话', id:'new', act: o.activeId==='P02'}]});
    groups.push({g:'资源', items:[{i:'db', t:'知识库', id:'kb'}]});
    groups.push({g:'系统', items:[{i:'gear', t:'后台管理', id:'admin', navto:'A00'}]});
    groups.push({g:'会话', items:[{i:'hist', t:'历史会话', id:'hist'}], subs:[
      {t:'部署问题咨询', dd:'14:32', id:'h1', act:o.activeId==='P03'},
      {t:'数据库连接配置', dd:'昨天', id:'h2'},
      {t:'案件流程梳理', dd:'8/22', id:'h3'},
      {t:'意图识别准确率', dd:'8/19', id:'h4'}
    ]});
  }

  if(o.admin){
    groups.push({g:'导航', items:[
      {i:'back', t:'返回对话', id:'back', navto:'P03'}
    ]});
    groups.push({g:'管理', items:[
      {i:'shield', t:'Dashboard', id:'A00', act:o.activeId==='A00'},
      {i:'brain', t:'智能体管理', id:'A01', act:o.activeId==='A01'},
      {i:'bulb', t:'提示词配置', id:'A02', act:o.activeId==='A02'},
      {i:'doc', t:'知识库管理', id:'A03', act:o.activeId==='A03'},
      {i:'layers', t:'分块管理', id:'A05', act:o.activeId==='A05'},
      {i:'tree', t:'知识图谱', id:'A06', act:o.activeId==='A06'},
      {i:'flow', t:'意图树配置', id:'A07', act:o.activeId==='A07'},
      {i:'tag', t:'意图列表', id:'A08', act:o.activeId==='A08'},
      {i:'link', t:'关键词映射', id:'A10', act:o.activeId==='A10'},
      {i:'warn', t:'数据通道', id:'A09', act:o.activeId==='A09'},
      {i:'scroll', t:'链路追踪', id:'A11', act:o.activeId==='A11'},
      {i:'warn', t:'审计日志', id:'A12', act:o.activeId==='A12'},
      {i:'case', t:'案件调查', id:'A13', act:o.activeId==='A13'},
      {i:'users', t:'用户管理', id:'A14', act:o.activeId==='A14'},
      {i:'bulb', t:'示例问题', id:'A15', act:o.activeId==='A15'},
      {i:'cog', t:'系统设置', id:'A16', act:o.activeId==='A16'}
    ]});
  }

  var html = '<aside class="sc-side" data-box="0,0,280,800" data-mod="侧栏">'+
    '<div class="bar" data-box="12,12,256,52">'+
      '<div class="mk" style="margin-left:'+markOffset.toFixed(2)+'px">'+HEX_SVG+'</div>'+
      '<div class="txtbox"><div class="wm"><span class="tx">sentinel</span></div></div>'+
    '</div>'+
    '<div class="nav ns-notch" data-box="76,12,256,668">';
  groups.forEach(function(gr){
    html += '<div class="navgroup">'+gr.g+'</div>';
    gr.items.forEach(function(it){
      var navAttr = it.navto ? ' data-navto="'+it.navto+'"' : '';
      html += '<div class="navitem'+(it.act?' act':'')+'" data-id="'+it.id+'"'+navAttr+'>'+
              nIc(it.i)+'<span>'+it.t+'</span></div>';
    });
    if(gr.subs){
      gr.subs.forEach(function(s){
        html += '<div class="subitem'+(s.act?' act':'')+'" data-id="'+s.id+'">'+
                '<span>'+s.t+'</span><span class="dd">'+s.dd+'</span></div>';
      });
    }
  });
  html += '</div>'+
    '<div class="acct" data-id="A14" data-mod="账户入口">'+
      '<div class="avt">A</div>'+
      '<div><div class="nm">admin</div><div class="role">超级管理员 · 在线</div></div>'+
    '</div>'+
    '</aside>';
  return html;
}

/* ==========================================================================
   通用顶部 + 帮助函数
   ========================================================================== */
function topBar(crumbs){
  return '<div class="pg-top" data-mod="顶栏">'+
    '<div class="crumb">'+crumbs+'</div>'+
    '<div class="r">'+
      '<div class="bell"><span class="dot"></span>'+
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8 A6 6 0 0 0 6 8 C6 13 4 15 4 16 H20 C20 15 18 13 18 8 Z"/><path d="M10 20 A2 2 0 0 0 14 20"/></svg>'+
      '</div>'+
      '<div class="search">'+
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20 L16 16"/></svg>'+
        '<input placeholder="全局搜索…" /></div>'+
    '</div></div>';
}

/* ==========================================================================
   adm() —— P05 风格后台分栏框架
   左导航栏（分类）+ 右内容区。用法：
     adm([{g:'分类', items:[{t:'名称', i:'icon', cur:true, n:'12'}]}], 内容HTML)
   ========================================================================== */
function adm(groups, content){
  var nav = '<nav class="adm-nav" data-mod="导航栏">';
  groups.forEach(function(gr){
    nav += '<div class="grp"><h4>'+gr.g+'</h4>';

/* ==========================================================================
   渲染：grid + 缩略图 + modal
   ========================================================================== */
var ACTIVE_TAB='all';

/* ==========================================================================
   重叠检测器 —— 模块独立化后的冲突告警（缩略图概览）
   对 tile 的 stage 内所有 [data-mod] 模块，两两检测矩形相交。
   仅相交才在 tile 标题右上加红色「冲突 N」角标提示；
   详细标红与列表在点击放大后的 modal 里展示（openModal）。
   ========================================================================== */
function checkOverlap(tile, stage){
  if(!stage) return;
  clearConflictMarks(stage);
  var mods = stage.querySelectorAll('[data-mod]');
  if(!mods.length) return;
  var sRect = stage.getBoundingClientRect();
  var scale = sRect.width / stage.offsetWidth;   /* CSS 坐标与 transform 缩放后的屏幕坐标换算 */
  var boxes = [];
  mods.forEach(function(el){
    var r = el.getBoundingClientRect();
    var left = (r.left - sRect.left) / scale;
    var top  = (r.top  - sRect.top)  / scale;
    boxes.push({ el:el, name:el.getAttribute('data-mod'),
      top:top, left:left, right:left + r.width/scale, bottom:top + r.height/scale });
  });
  /* 排除「完全包含」的父子嵌套（容器包内部模块是正常的，不算重叠冲突） */
  function isInside(a,b){
    return a.left <= b.left && a.right >= b.right && a.top <= b.top && a.bottom >= b.bottom;
  }
  /* 两两检测「真实相交」= 部分重叠，而非完全包含 */
  var conflicts = 0;
  var marked = [];
  for(var i=0;i<boxes.length;i++)for(var j=i+1;j<boxes.length;j++){
    var a=boxes[i], b=boxes[j];
    if(isInside(a,b) || isInside(b,a)) continue;          /* 嵌套包含，跳过 */
    if(a.left < b.right && b.left < a.right && a.top < b.bottom && b.top < a.bottom){
      conflicts++;
      marked.push(a,b);
    }
  }
  marked.forEach(function(b){ markConflictBox(stage, b); });
  for(var k=0;k<marked.length;k+=2){
    var ma=marked[k], mb=marked[k+1];
    addConflictHit(stage, {
      ox:Math.max(ma.left,mb.left), oy:Math.max(ma.top,mb.top),
      ow:Math.min(ma.right,mb.right)-Math.max(ma.left,mb.left),
      oh:Math.min(ma.bottom,mb.bottom)-Math.max(ma.top,mb.top)
    });
  }
  /* 移除旧的角标 */
  var old = tile.querySelector('.tile-cf'); if(old) old.remove();
  /* 有冲突：在标题行加红色角标 */
  if(conflicts){
    var badge = document.createElement('span');
    badge.className = 'tile-cf';
    badge.textContent = '冲突 '+conflicts;
    badge.title = '点击放大查看冲突模块';
    var ph = tile.querySelector('.ph');
    if(ph) ph.appendChild(badge);
  }
}

function build(){
  var grid=document.getElementById('grid'); grid.innerHTML='';
  PAGES.forEach(function(p){
    if(ACTIVE_TAB!=='all' && p.type!==ACTIVE_TAB) return;
    var tile=document.createElement('div');
    tile.className='tile';
    tile.innerHTML='<div class="ph">'+
      '<span class="pid">'+p.id+'</span>'+
      '<h3 class="ttl">'+p.title+'</h3>'+
      '</div>'+
      '<p class="dsc">'+p.dsc+'</p>'+
      '<div class="thumb"><span class="ph-old">'+p.id+' · '+p.title.toUpperCase()+'</span>'+
        '<div class="stage">'+p.render()+'</div></div>';
    tile.addEventListener('click',function(){ openModal(p); });
    grid.appendChild(tile);
  });
  /* 等待字体和布局完成后再跑重叠检测，确保所有模块坐标稳定 */
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      grid.querySelectorAll('.tile').forEach(function(t){
        checkOverlap(t, t.querySelector('.stage'));
      });
    });
  });
}

function clearConflictMarks(root){
  root.querySelectorAll('.ovl').forEach(function(el){ el.classList.remove('ovl'); });
  root.querySelectorAll('.ovl-badge,.ovl-hit').forEach(function(el){ el.remove(); });
}
function markConflictBox(root, b){
  if(!root || !b || !b.el) return;
  b.el.classList.add('ovl');
  if(root.querySelector('.ovl-badge[data-for="'+b.name+'"]')) return;
  var badge = document.createElement('span');
  badge.className = 'ovl-badge';
  badge.dataset.for = b.name;
  badge.textContent = '⚠ 冲突 · '+b.name;
  badge.style.left = Math.max(0, b.left + 4) + 'px';
  badge.style.top = Math.max(0, b.top + 4) + 'px';
  root.appendChild(badge);
}
function addConflictHit(root, c){
  var hit = document.createElement('div');
  hit.className = 'ovl-hit';
  hit.style.left = c.ox + 'px';
  hit.style.top = c.oy + 'px';
  hit.style.width = Math.max(8, c.ow) + 'px';
  hit.style.height = Math.max(8, c.oh) + 'px';
  root.appendChild(hit);
}

function flashOvl(el){

}

/* 后台左侧导航宽度调整，仅作用于当前打开的预览页 */
function bindAdmNavResizer(root){
  var adm = root && root.querySelector('.adm');
  var resizer = adm && adm.querySelector('.adm-resizer');
  if(!adm || !resizer) return;

  var startX = 0;
  var startWidth = 190;
  var active = false;

  resizer.addEventListener('pointerdown', function(e){
    if(e.button !== 0) return;
    active = true;
    startX = e.clientX;
    startWidth = adm.querySelector('.adm-nav').getBoundingClientRect().width;
    adm.classList.add('is-resizing');
    resizer.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  resizer.addEventListener('pointermove', function(e){
    if(!active) return;
    var width = Math.max(160, Math.min(320, startWidth + e.clientX - startX));
    adm.style.setProperty('--adm-nav-w', width + 'px');
  });
  resizer.addEventListener('pointerup', function(){ active = false; adm.classList.remove('is-resizing'); });
  resizer.addEventListener('pointercancel', function(){ active = false; adm.classList.remove('is-resizing'); });
}

/* 渲染指定页面到 modal 内容区，并绑定翻页交互 */
function renderIntoModal(p){
  document.getElementById('mPid').textContent = p.id;
  document.getElementById('mTtl').textContent = p.title;
  document.getElementById('mMeta').textContent = '1280 × 800 · 可缩放 · 可翻页';
  document.getElementById('mCv').innerHTML = p.render();
  bindAdmNavResizer(document.getElementById('mCv'));

  /* 自适应缩放 */
  var box = document.querySelector('.modal .box');
  var wrap = document.getElementById('mCvWrap');
  var vw = window.innerWidth || 1280;
  var vh = window.innerHeight || 800;
  var availW = (box && box.clientWidth) ? box.clientWidth - 24 : vw * 0.9;
  var availH = (box && box.clientHeight) ? box.clientHeight - 60 : vh * 0.86;
  var s = Math.max(0.2, Math.min(1, availW/1280, availH/800));
  wrap.style.transform = 'scale('+s+')';
  wrap.style.height = (800*s)+'px';
  wrap.style.width = (1280*s)+'px';

  /* 绑定翻页切换：data-navto 元素点击 -> navigate */
  var cv = document.getElementById('mCv');
  cv.querySelectorAll('[data-navto]').forEach(function(el){
    el.addEventListener('click', function(){
      var to = el.getAttribute('data-navto');
      if(to) navigate(to);
    });
  });

  /* 运行重叠检测 */
  setTimeout(function(){ runOverlapCheck(cv); }, 60);
}

/* 翻页切换：当前页飞出 -> 加载目标页 -> 飞入 */
function navigate(pid){
  var target = findPage(pid);
  if(!target) return;
  var wrap = document.getElementById('mCvWrap');
  /* 飞出 */
  wrap.classList.remove('pg-in');
  wrap.classList.add('pg-out');
  setTimeout(function(){
    renderIntoModal(target);
    wrap.classList.remove('pg-out');
    void wrap.offsetWidth; /* 重启动画 */
    wrap.classList.add('pg-in');
    setTimeout(function(){ wrap.classList.remove('pg-in'); }, 450);
  }, 430);
}

/* modal 内重叠检测（抽取） */
function runOverlapCheck(cv){
  clearConflictMarks(cv);
  var mods = cv.querySelectorAll('[data-mod]');
  var conflicts = [];
  function isInside(a,b){
    return a.left<=b.left && a.right>=b.right && a.top<=b.top && a.bottom>=b.bottom;
  }
  if(mods.length){
    var boxes=[];
    var sr=cv.getBoundingClientRect();
    var scale = cv.getBoundingClientRect().width/1280;
    mods.forEach(function(el){
      var r=el.getBoundingClientRect();
      boxes.push({el:el,name:el.getAttribute('data-mod'),
        top:(r.top-sr.top)/scale,left:(r.left-sr.left)/scale,
        right:(r.left-sr.left)/scale+r.width/scale,bottom:(r.top-sr.top)/scale+r.height/scale});
    });
    for(var i=0;i<boxes.length;i++)for(var j=i+1;j<boxes.length;j++){
      var a=boxes[i],b=boxes[j];
      if(isInside(a,b) || isInside(b,a)) continue;
      if(a.left<b.right && b.left<a.right && a.top<b.bottom && b.top<a.bottom){
        var oL=Math.max(a.left,b.left), oT=Math.max(a.top,b.top);
        var oR=Math.min(a.right,b.right), oB=Math.min(a.bottom,b.bottom);
        conflicts.push({
          a:a, b:b, ow:Math.round(oR-oL), oh:Math.round(oB-oT),
          ox:Math.round(oL), oy:Math.round(oT),
          aRect:'['+Math.round(a.left)+','+Math.round(a.top)+' '+Math.round(a.right-a.left)+'×'+Math.round(a.bottom-a.top)+']',
          bRect:'['+Math.round(b.left)+','+Math.round(b.top)+' '+Math.round(b.right-b.left)+'×'+Math.round(b.bottom-b.top)+']'
        });
      }
    }
  }
  conflicts.forEach(function(c){ markConflictBox(cv, c.a); markConflictBox(cv, c.b); addConflictHit(cv, c); });
  var btn=document.getElementById('mCfBtn');
  var list=document.getElementById('mCfList');
  btn.textContent = '冲突 '+(conflicts.length ? conflicts.length : 0);
  btn.style.display = conflicts.length ? '' : 'none';
  list.innerHTML='';
  if(!conflicts.length){
    list.innerHTML='<div class="empty">✓ 无布局冲突</div>';
  }else{
    conflicts.forEach(function(c){
      var it=document.createElement('div');
      it.className='it';
      it.innerHTML='▣ <b>'+c.a.name+'</b> × <b>'+c.b.name+'</b><br>'+
        '<span style="opacity:.8">重叠区 ('+c.ox+','+c.oy+') '+c.ow+'×'+c.oh+'px</span>';
      it.title = c.a.name+' '+c.aRect+'\n'+c.b.name+' '+c.bRect;
      it.addEventListener('click',function(){
        flashOvl(c.a.el); flashOvl(c.b.el);
        list.classList.add('hide');
      });
      list.appendChild(it);
    });
  }
  conflicts.forEach(function(c){ c.a.el.classList.add('ovl'); c.b.el.classList.add('ovl'); });
}

function openModal(p){
  renderIntoModal(p);
  document.getElementById('modal').classList.add('open');
}
document.getElementById('mClose').addEventListener('click', function(){
  document.getElementById('modal').classList.remove('open');
});
document.getElementById('mCfBtn').addEventListener('click', function(e){
  e.stopPropagation();
  document.getElementById('mCfList').classList.toggle('hide');
});
document.getElementById('modal').addEventListener('click', function(e){
  if(e.target===this) this.classList.remove('open');
});
document.addEventListener('keydown', function(e){
  if(e.key==='Escape') document.getElementById('modal').classList.remove('open');
});
