# 鐭ヨ瘑鍥捐氨妫�绱㈡爤锛歂eo4j锛堝浘瀛樺偍锛? LightRAG锛堟瀯寤?/ 妫�绱㈠井鏈嶅姟锛?# KV / 鍚戦噺 / 鏂囨。鐘舵�佸�嶇敤瀹夸富鏈虹幇鏈� PostgreSQL锛坧gvector 宸茶�咃級锛屾湰鏍堝彧鏂板�?Neo4j + LightRAG 涓よ繘绋?#
# 涓庡悗绔�瀵规帴锛歛pplication.yaml 缃?rag.graph.type=lightrag銆乺ag.graph.lightrag.base-url=http://127.0.0.1:9621
# 涓�鎬у寲鍙傛暟浠庡悓鐩�褰� .env 璇诲彇锛堟ā鏉胯�� .env.example锛夛紱LightRAG 涓嶅惎鐢?API 閴存潈
#
# IDEA锛氬�嶅�?.env.example 涓?.env 骞跺～鍐欏瘑閽ュ悗锛岀洿鎺ョ偣鍑绘湰鏂囦欢鐨?Compose 鍚�鍔ㄦ寜閽�
# Neo4j Browser http://localhost:7474 锝?LightRAG WebUI http://localhost:9621/webui

services:
  neo4j:
    container_name: neo4j
    # GDS 鍥哄畾杩涙湰鍦伴暅鍍忥紝閬垮厤瀹樻柟鎻掍欢瀹夎�呭櫒鍦ㄦ瘡娆￠噸鍚�鏃堕噸鏂拌仈缃戜笅杞?62 MB JAR
    image: sentinel/neo4j-gds:5.26-2.13.11
    build:
      context: .
      dockerfile: neo4j-gds.Dockerfile
    ports:
      - "7474:7474"   # HTTP Browser
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: "${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}"
      # APOC 宸查殢 Neo4j 闀滃儚鎻愪緵锛汫DS 鐢?neo4j-gds.Dockerfile 鍥哄畾锛屼笉鍐嶆斁鍏ユ�よ繍琛屾椂涓嬭浇鍒楄�?      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_server_memory_heap_max__size: "1G"
      NEO4J_server_memory_pagecache_size: "512m"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "auth=$${NEO4J_AUTH}; cypher-shell -u \"$${auth%%/*}\" -p \"$${auth#*/}\" 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  lightrag:
    container_name: lightrag
    # 鈿狅笍 鐢熶骇鍔″繀 pin 鍒板凡楠岃瘉鐨勫叿浣?tag锛堢ぞ鍖轰粨搴撳瓨鍦ㄨ秴鍓嶆棩鏈熺増鏈?/ 铏氭瀯妯″瀷鍚嶏紝鍕块暱鏈熺敤 latest锛?    image: ghcr.io/hkuds/lightrag:${LIGHTRAG_IMAGE_TAG:-latest}
    ports:
      - "9621:9621"
    # Docker Desktop / IDEA 鍙�鑳界嫭绔嬮噸鍚�瀹瑰櫒锛岀粫杩?depends_on 鐨勫氨缁�椤哄簭銆?    # 灏嗙瓑寰呴棬闂╂斁鍦?LightRAG 瀹瑰櫒鍐呴儴锛岀‘淇?Neo4j Bolt 灏辩华鍚庢墠鍚�鍔ㄥ簲鐢ㄣ�?    entrypoint:
      - /bin/sh
      - -ec
      - |
        echo "Waiting for Neo4j Bolt at neo4j:7687..."
        until python -c "import socket; socket.create_connection(('neo4j', 7687), 2).close()" >/dev/null 2>&1; do
          sleep 2
        done
        echo "Neo4j Bolt is ready; starting LightRAG."
        exec python -m lightrag.api.lightrag_server
    environment:
      WORKING_DIR: "/app/data/rag_storage"
      INPUT_DIR: "/app/data/inputs"
      # 鈥斺�?LLM 涓庡悗绔�榛樿�ゆā鍨嬩竴鑷翠娇鐢ㄧ櫨鐐硷紱Embedding 浣跨敤 SiliconFlow 鈥斺�?      LLM_BINDING: "${LLM_BINDING:-openai}"
      LLM_BINDING_HOST: "${LLM_BINDING_HOST:-https://dashscope.aliyuncs.com/compatible-mode/v1}"
      LLM_BINDING_API_KEY: "${BAILIAN_API_KEY:?BAILIAN_API_KEY is required}"
      LLM_MODEL: "${LLM_MODEL:-qwen-plus-latest}"
      # 瀹炰綋 / 鍏崇郴鐨勬弿杩颁笌鎽樿�佽緭鍑鸿��瑷�锛孡ightRAG 榛樿�� English锛涙湰椤圭洰涓轰腑鏂囧簱鏁呯疆涓�鏂�
      # 浠呭�规敼鍚庢柊寤� / 閲嶅缓鐨勭储寮曠敓鏁堬紝宸叉娊鍙栧嚭鐨勮嫳鏂囨弿杩伴渶閲嶅缓绱㈠紩鎵嶄細杞�涓轰腑鏂�
      SUMMARY_LANGUAGE: "${SUMMARY_LANGUAGE:-绠�浣撲腑鏂噠"
      EMBEDDING_BINDING: "${EMBEDDING_BINDING:-openai}"
      EMBEDDING_BINDING_HOST: "${EMBEDDING_BINDING_HOST:-https://api.siliconflow.cn/v1}"
      EMBEDDING_BINDING_API_KEY: "${SILICONFLOW_API_KEY:?SILICONFLOW_API_KEY is required}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-8B}"
      EMBEDDING_DIM: "${EMBEDDING_DIM:-1536}" # 涓?application.yaml 鐨?rag.default.dimension 涓�鑷?      EMBEDDING_SEND_DIM: "true"  # 瑕佹眰 SiliconFlow 瀹為檯杩斿洖 1536 缁达紝鑰岄潪妯″瀷榛樿�ょ淮搴�
      # 鈥斺�?瀛樺偍锛氬浘 = Neo4j锛汯V / 鍚戦噺 / 鏂囨。鐘舵�?= 澶嶇敤瀹夸富 PostgreSQL 鈥斺�?      LIGHTRAG_GRAPH_STORAGE: "Neo4JStorage"
      LIGHTRAG_KV_STORAGE: "PGKVStorage"
      LIGHTRAG_VECTOR_STORAGE: "PGVectorStorage"
      LIGHTRAG_DOC_STATUS_STORAGE: "PGDocStatusStorage"
      NEO4J_URI: "neo4j://neo4j:7687"
      NEO4J_USERNAME: "${NEO4J_USERNAME:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}"
      NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
      POSTGRES_HOST: "${POSTGRES_HOST:-host.docker.internal}"
      POSTGRES_PORT: "${POSTGRES_PORT:-5432}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DATABASE: "${POSTGRES_DATABASE:-sentinel}"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux 涔熻兘瑙ｆ瀽瀹夸富鏈猴紱Mac/Win 鍘熺敓鏀�鎸�
    volumes:
      - lightrag-data:/app/data
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9621/health')\" >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s
    restart: unless-stopped

volumes:
  neo4j-data:
  neo4j-logs:
  lightrag-data:

networks:
  default:
    name: lightrag-net
